<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DailyObjects — Portfolio Viewer</title>
  <meta name="description" content="Priya Rawal’s DailyObjects portfolio and partner pitch decks.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Ctext x='16' y='24' font-size='24' text-anchor='middle' fill='%23F6F6F6' font-family='Georgia,serif' font-style='italic'%3Ep%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="work-gallery.css?v=20260914-dailyobjects-archive">
  <link rel="stylesheet" href="pdf-viewer.css?v=20260914-1">
</head>
<body class="pdf-viewer-page">
  <a class="skip-link" href="#viewer">Skip to portfolio</a>

  <header class="pdf-viewer-nav">
    <a class="pdf-viewer-nav__back" href="work-dailyobjects.html?v=20260914-archive#complete-portfolio">Back to DailyObjects</a>
    <div class="pdf-viewer-nav__title">
      <strong id="viewer-title">DailyObjects</strong>
      <span id="viewer-subtitle">Complete Portfolio 2021 to 2022</span>
    </div>
    <div class="pdf-viewer-nav__controls">
      <span id="pdf-status" aria-live="polite">Loading</span>
      <a id="pdf-download" href="#" download>Download</a>
    </div>
  </header>

  <main class="pdf-viewer-shell" id="viewer">
    <div class="pdf-viewer-loading" id="pdf-loading" role="status">
      <span class="pdf-viewer-loading__spinner" aria-hidden="true"></span>
      <p id="viewer-loading-copy">Opening the DailyObjects archive…</p>
    </div>
    <div class="pdf-viewer-pages" id="pdf-pages" aria-label="DailyObjects portfolio"></div>
    <div class="pdf-viewer-error" id="pdf-error" hidden>
      <p>The portfolio could not be displayed in this browser.</p>
      <a id="pdf-error-download" href="#" download>Download</a>
    </div>
    <noscript>
      <div class="pdf-viewer-error"><p>JavaScript is required to display this portfolio.</p><a href="work-dailyobjects.html#complete-portfolio">Back to DailyObjects</a></div>
    </noscript>
  </main>

  <script type="module" src="dailyobjects-pdf-viewer.js?v=20260914-packaging-pages"></script>
</body>
</html>
